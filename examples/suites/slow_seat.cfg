# exchange-lab suite file: the standard market with the seat at 100 us instead of 10 us.
# docs/RUNNER.md, "A suite of your own", says what each line does and what a file cannot set.
#
#   /compare imbalance suite=examples/suites/slow_seat.cfg
#   make compare CANDIDATES=imbalance SUITE_FILE=examples/suites/slow_seat.cfg
#
# A suite of its own: its name and version are conditions, so its fingerprint is not
# standard's, and its result is never pooled with standard's.
suitefile.format=1
suite.name=slow_seat
suite.version=1
suite.lineup=maker,rival,informed,noise:2,momentum
suite.session_ns=25000000
seat.reaction_ns=100000
block.first_seed=42
block.seeds=64
